name: smashtravelvietnam-com-be

services:
  app:
    image: ${DOCKER_IMAGE}:${VERSION}
    container_name: ${DOCKER_CONTAINER_NAME}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/secrets/google-recaptcha-enterprise-key.json
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      VERSION: ${VERSION}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      UPLOAD_PATH: /app/public/media
      RECAPTCHA_PROJECT_ID: ${RECAPTCHA_PROJECT_ID}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      SUPADMIN_EMAIL: ${SUPADMIN_EMAIL}
      SUPADMIN_PASSWORD: ${SUPADMIN_PASSWORD}
      SUPADMIN_NAME: ${SUPADMIN_NAME}
    volumes:
      - storage_data:/app/public/media
      - /opt/apps/smashtravelvietnam.com/secrets/google-recaptcha-enterprise-key.json:/opt/secrets/google-recaptcha-enterprise-key.json:ro
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: local
    networks:
      - smashtravelvietnam-com-be
      - nginx-proxy-manager

  db:
    image: postgres:17
    container_name: smashtravelvietnam_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: local
    networks:
      - smashtravelvietnam-com-be

volumes:
  postgres_data:
  storage_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/apps/smashtravelvietnam.com/storage
      o: bind

networks:
  smashtravelvietnam-com-be:
    name: smashtravelvietnam-com-be
    driver: bridge
  nginx-proxy-manager:
    external: true
